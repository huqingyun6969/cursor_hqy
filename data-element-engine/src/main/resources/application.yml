server:
  port: 8080

spring:
  application:
    name: data-element-engine
  datasource:
    url: jdbc:mysql://localhost:33306/data_element_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

flowable:
  database-schema-update: true
  async-executor-activate: false

liteflow:
  print-execution-log: true
  rule-source: ""

engine:
  max-concurrent-tasks: 10
  queue-capacity: 100
  cpu-threshold: 80
  memory-threshold: 80
  default-batch-size: 10000
  default-max-concurrent-subtasks: 10
  default-subtask-timeout-sec: 60
  pool:
    max-size: 10
    min-idle: 2
    idle-timeout: 60000
    max-lifetime: 300000
    connection-timeout: 30000

powerjob:
  enabled: false
  server-address: 10.10.21.130:28089
  app-name: mesadmin
  app-secret: mesadmin

logging:
  level:
    com.example.ruleengine: DEBUG
